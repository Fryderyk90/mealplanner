name: Bug
description: Something is broken or behaves unexpectedly
title: 'fix: '
labels: ['type:bug']
projects: ['Fryderyk90/3']

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: 1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - Local (Aspire)
        - Docker Compose
        - Kubernetes (kind)
        - CI
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/error output
      render: shell
    validations:
      required: false
