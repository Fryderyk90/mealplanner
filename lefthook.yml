# Git hooks, installed by `pnpm install` (the "prepare" script runs `lefthook install`).
# Docs: https://lefthook.dev
# Skip in an emergency with: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  jobs:
    - name: dotnet-format
      glob: '*.cs'
      run: dotnet format MealPlanner.slnx --include {staged_files}
      stage_fixed: true

    - name: prettier
      glob: '*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml,css}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
